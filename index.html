<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070707" />
  <meta name="description" content="TiaFlix — a birthday story made just for Tia." />
  <title>TiaFlix — Happy 22nd Birthday, Tia</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.site-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505;opacity:0;transition:opacity .9s ease}.site-frame.ready{opacity:1}.birthday{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 36%,#241018 0,#0e080b 34%,#050505 70%);transition:opacity 1s ease,visibility 1s ease}.birthday::before{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.25) 0 1px,transparent 1.5px),radial-gradient(circle at 75% 35%,rgba(255,255,255,.2) 0 1px,transparent 1.5px);background-size:90px 90px,130px 130px;animation:drift 18s linear infinite}.birthday.hidden{opacity:0;visibility:hidden;pointer-events:none}.panel{position:relative;z-index:5;text-align:center;width:min(92vw,720px);padding:32px 20px}.mini{font-size:clamp(12px,2vw,15px);letter-spacing:.28em;text-transform:uppercase;color:#d7c7cc;margin:0 0 18px}.brand{font-weight:900;letter-spacing:-.06em;font-size:clamp(42px,10vw,88px);line-height:.9;margin:0 0 20px}.brand span{color:#e50914}.pre{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,6vw,54px);font-weight:400;line-height:1.08;margin:0 0 28px}.celebrate,.enter{appearance:none;border:0;border-radius:999px;cursor:pointer;font-weight:800;font-size:16px;padding:15px 24px;transition:transform .2s ease,box-shadow .2s ease}.celebrate{background:#fff;color:#111;box-shadow:0 12px 40px rgba(0,0,0,.35)}.celebrate:hover,.enter:hover{transform:translateY(-2px) scale(1.02)}.message{opacity:0;transform:translateY(18px) scale(.98);transition:opacity 1s ease,transform 1s ease;pointer-events:none}.celebrating .message{opacity:1;transform:none}.message h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,8vw,68px);line-height:1.03;margin:0 0 14px;font-weight:500}.message p{font-size:clamp(16px,3.5vw,22px);color:#dbcfd3;margin:0}.enter{margin-top:30px;background:#e50914;color:white;opacity:0;transform:translateY(12px);pointer-events:none;box-shadow:0 12px 44px rgba(229,9,20,.28);transition:opacity .7s ease,transform .7s ease,box-shadow .2s ease}.enter.show{opacity:1;transform:none;pointer-events:auto}.celebrating .pre,.celebrating .celebrate{opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .5s ease,transform .5s ease}.sound{position:absolute;z-index:10;top:max(16px,env(safe-area-inset-top));right:16px;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,10,.46);backdrop-filter:blur(12px);color:#fff;border-radius:999px;padding:10px 13px;cursor:pointer;font-size:14px}.replay{position:fixed;z-index:900;right:14px;bottom:max(14px,env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(8,8,8,.68);backdrop-filter:blur(12px);color:#fff;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .4s ease,transform .2s ease}.replay.show{opacity:.82;pointer-events:auto}.replay:hover{opacity:1;transform:scale(1.06)}.balloons,.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.balloon{position:absolute;left:var(--x);bottom:-180px;width:var(--s);height:calc(var(--s)*1.24);border-radius:52% 48% 48% 52% / 58% 58% 42% 42%;background:var(--c);box-shadow:inset -10px -14px 22px rgba(0,0,0,.16),inset 8px 8px 18px rgba(255,255,255,.18),0 14px 30px rgba(0,0,0,.18);animation:floatUp var(--d) cubic-bezier(.22,.65,.35,1) var(--delay) forwards}.balloon::before{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:9px solid var(--c)}.balloon::after{content:"";position:absolute;top:100%;left:50%;width:1px;height:90px;background:linear-gradient(rgba(255,255,255,.55),transparent);transform-origin:top;animation:stringSway 2.8s ease-in-out infinite alternate}.piece{position:absolute;top:-30px;left:var(--x);width:var(--w);height:var(--h);border-radius:2px;background:var(--c);opacity:.95;transform:rotate(var(--r));animation:confettiFall var(--d) ease-in var(--delay) forwards}.glow{position:absolute;width:56vw;height:56vw;max-width:560px;max-height:560px;border-radius:50%;background:rgba(229,9,20,.13);filter:blur(90px);opacity:0;transform:scale(.7);transition:opacity 1.2s ease,transform 1.2s ease}.celebrating .glow{opacity:1;transform:scale(1)}@keyframes floatUp{0%{transform:translate3d(0,0,0) rotate(-4deg)}25%{transform:translate3d(22px,-30vh,0) rotate(4deg)}55%{transform:translate3d(-18px,-66vh,0) rotate(-3deg)}100%{transform:translate3d(10px,-125vh,0) rotate(2deg)}}@keyframes stringSway{to{transform:rotate(7deg)}}@keyframes confettiFall{0%{transform:translate3d(0,-5vh,0) rotate(var(--r));opacity:0}10%{opacity:1}100%{transform:translate3d(var(--dx),110vh,0) rotate(calc(var(--r) + 720deg));opacity:.7}}@keyframes drift{to{transform:translate3d(40px,30px,0)}}@media(max-width:600px){.panel{padding:24px 18px}.sound{font-size:0;width:42px;height:42px}.sound::after{content:"♪";font-size:18px}.replay{width:42px;height:42px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <iframe id="site" class="site-frame" src="/loveflix-original.html" title="TiaFlix"></iframe>
  <section id="birthday" class="birthday" aria-label="TiaFlix birthday surprise">
    <div class="glow"></div><div id="balloons" class="balloons"></div><div id="confetti" class="confetti"></div>
    <button id="sound" class="sound" type="button" aria-label="Mute birthday music">♪ Sound on</button>
    <div class="panel">
      <p class="mini">A TiaFlix Birthday Special</p>
      <div class="brand">TIA<span>FLIX</span></div>
      <h2 class="pre">Before you press play…</h2>
      <button id="celebrate" class="celebrate" type="button">🎈 Celebrate</button>
      <div class="message" aria-live="polite"><h1>Happy 22nd Birthday, Tia ❤️</h1><p>Today, you’re the main character.</p></div>
      <button id="enter" class="enter" type="button">▶ Enter TiaFlix</button>
    </div>
  </section>
  <button id="replay" class="replay" type="button" title="Replay birthday surprise" aria-label="Replay birthday surprise">🎈</button>
<script>
(() => {
  const birthday=document.getElementById('birthday'), celebrate=document.getElementById('celebrate'), enter=document.getElementById('enter'), sound=document.getElementById('sound'), replay=document.getElementById('replay'), frame=document.getElementById('site');
  let ctx=null,gain=null,muted=false,timers=[];
  const colors=['#e50914','#ff8fa3','#ffd7de','#f6c453','#ffffff','#a56cff','#ff6b8a'];
  function balloons(){const root=document.getElementById('balloons');root.innerHTML='';for(let i=0;i<18;i++){const b=document.createElement('i');b.className='balloon';b.style.setProperty('--x',(Math.random()*94)+'%');b.style.setProperty('--s',(42+Math.random()*44)+'px');b.style.setProperty('--c',colors[Math.floor(Math.random()*colors.length)]);b.style.setProperty('--d',(7+Math.random()*4)+'s');b.style.setProperty('--delay',(Math.random()*2.2)+'s');root.appendChild(b)}}
  function confetti(){const root=document.getElementById('confetti');root.innerHTML='';for(let i=0;i<110;i++){const p=document.createElement('i');p.className='piece';p.style.setProperty('--x',(Math.random()*100)+'%');p.style.setProperty('--w',(5+Math.random()*7)+'px');p.style.setProperty('--h',(8+Math.random()*12)+'px');p.style.setProperty('--c',colors[Math.floor(Math.random()*colors.length)]);p.style.setProperty('--r',(Math.random()*180)+'deg');p.style.setProperty('--dx',(-90+Math.random()*180)+'px');p.style.setProperty('--d',(3.5+Math.random()*3)+'s');p.style.setProperty('--delay',(Math.random()*.9)+'s');root.appendChild(p)}}
  const notes={'G4':392,'A4':440,'B4':493.88,'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99};
  const song=[['G4',.32],['G4',.18],['A4',.55],['G4',.55],['C5',.55],['B4',1],['G4',.32],['G4',.18],['A4',.55],['G4',.55],['D5',.55],['C5',1],['G4',.32],['G4',.18],['G5',.55],['E5',.55],['C5',.55],['B4',.55],['A4',1],['F5',.32],['F5',.18],['E5',.55],['C5',.55],['D5',.55],['C5',1.15]];
  function music(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();gain=gain||ctx.createGain();gain.connect(ctx.destination);gain.gain.value=muted?0:.045;let t=ctx.currentTime+.08;song.forEach(([n,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=notes[n];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55,t+.035);g.gain.exponentialRampToValueAtTime(.001,t+d*.86);o.connect(g);g.connect(gain);o.start(t);o.stop(t+d);t+=d})}catch(e){}}
  function replaceBranding(doc){if(!doc||!doc.body)return;doc.title='TiaFlix — For Tia';const walk=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);nodes.forEach(n=>{if(n.parentElement&&/^(SCRIPT|STYLE|NOSCRIPT)$/.test(n.parentElement.tagName))return;n.nodeValue=n.nodeValue.replace(/LOVEFLIX/g,'TIAFLIX').replace(/LoveFlix/g,'TiaFlix')});doc.querySelectorAll('[aria-label],[title]').forEach(el=>['aria-label','title'].forEach(a=>{if(el.hasAttribute(a))el.setAttribute(a,el.getAttribute(a).replace(/LOVEFLIX/g,'TIAFLIX').replace(/LoveFlix/g,'TiaFlix'))}));const b=doc.querySelector('.brand');if(b)b.innerHTML='TIA<span>FLIX</span>';const im=doc.querySelector('.intro-mark');if(im){im.innerHTML='T<span>♥</span>';im.setAttribute('aria-label','TiaFlix')}}
  function watchInner(){try{const d=frame.contentDocument;replaceBranding(d);new MutationObserver(()=>replaceBranding(d)).observe(d.body,{childList:true,subtree:true,characterData:true});}catch(e){}}
  function unlockInner(){try{const d=frame.contentDocument;replaceBranding(d);const btn=d.querySelector('.intro .play-button');if(btn)btn.click();const intro=d.querySelector('.intro');setTimeout(()=>{if(intro&&getComputedStyle(intro).display!=='none'&&intro.getAttribute('aria-hidden')!=='true')intro.style.display='none'},500)}catch(e){}}
  function start(){birthday.classList.add('celebrating');balloons();confetti();music();timers.push(setTimeout(()=>enter.classList.add('show'),4300))}
  function enterSite(){sessionStorage.setItem('tiaflixBirthdaySeen','1');birthday.classList.add('hidden');frame.classList.add('ready');replay.classList.add('show');unlockInner()}
  function reset(){timers.forEach(clearTimeout);timers=[];birthday.classList.remove('hidden','celebrating');enter.classList.remove('show');document.getElementById('balloons').innerHTML='';document.getElementById('confetti').innerHTML='';replay.classList.remove('show')}
  celebrate.addEventListener('click',start);enter.addEventListener('click',enterSite);replay.addEventListener('click',()=>{reset();setTimeout(()=>birthday.classList.remove('hidden'),20)});sound.addEventListener('click',()=>{muted=!muted;if(gain)gain.gain.value=muted?0:.045;sound.textContent=muted?'♪ Muted':'♪ Sound on';sound.setAttribute('aria-label',muted?'Unmute birthday music':'Mute birthday music')});
  frame.addEventListener('load',()=>{watchInner();if(sessionStorage.getItem('tiaflixBirthdaySeen')==='1'){birthday.classList.add('hidden');frame.classList.add('ready');replay.classList.add('show');setTimeout(unlockInner,250)}});
  if(sessionStorage.getItem('tiaflixBirthdaySeen')==='1'){birthday.classList.add('hidden');frame.classList.add('ready');replay.classList.add('show')}
})();
</script>
</body>
</html>

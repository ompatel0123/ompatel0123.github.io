<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>TiaFlix — Happy 22nd Birthday, Tia</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505;opacity:0;transition:opacity .7s}.site.show{opacity:1}.intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 35%,#2b1018 0,#12090d 36%,#050505 72%);transition:opacity .7s,visibility .7s}.intro.hide{opacity:0;visibility:hidden;pointer-events:none}.wrap{position:relative;z-index:3;padding:24px;width:min(92vw,720px)}.eyebrow{letter-spacing:.25em;text-transform:uppercase;font-size:12px;color:#cdbfc3;margin-bottom:14px}.logo{font-weight:900;font-size:clamp(48px,12vw,90px);letter-spacing:-.06em;margin-bottom:20px}.logo span{color:#e50914}.pre{font-family:Georgia,serif;font-size:clamp(28px,6vw,52px);font-weight:400;margin:0 0 28px}.btn{border:0;border-radius:999px;padding:15px 24px;font-size:16px;font-weight:800;cursor:pointer}.celebrate{background:#fff;color:#111}.enter{background:#e50914;color:#fff;margin-top:28px;opacity:0;pointer-events:none;transform:translateY(10px);transition:.5s}.enter.show{opacity:1;pointer-events:auto;transform:none}.msg{opacity:0;transform:translateY(16px);transition:.7s}.celebrating .msg{opacity:1;transform:none}.celebrating .pre,.celebrating .celebrate{opacity:0;pointer-events:none}.msg h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(36px,8vw,68px);line-height:1.03;margin:0 0 12px}.msg p{font-size:clamp(16px,4vw,22px);color:#d8cbd0}.balloons,.confetti{position:absolute;inset:0;pointer-events:none}.balloon{position:absolute;bottom:-150px;left:var(--x);width:var(--s);height:calc(var(--s)*1.2);border-radius:50%;background:var(--c);box-shadow:inset -9px -13px 20px rgba(0,0,0,.18),inset 7px 7px 15px rgba(255,255,255,.18);animation:up var(--d) ease-in var(--delay) forwards}.piece{position:absolute;top:-20px;left:var(--x);width:7px;height:12px;background:var(--c);transform:rotate(var(--r));animation:fall var(--d) ease-in var(--delay) forwards}.replay{position:fixed;right:14px;bottom:14px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid #444;background:#111c;color:#fff;display:none}.replay.show{display:block}@keyframes up{to{transform:translateY(-125vh) rotate(12deg)}}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
</style>
</head>
<body>
<iframe id="site" class="site" src="/loveflix-original.html" title="TiaFlix"></iframe>
<section id="intro" class="intro">
<div id="balloons" class="balloons"></div><div id="confetti" class="confetti"></div>
<div class="wrap"><div class="eyebrow">A TiaFlix Birthday Special</div><div class="logo">TIA<span>FLIX</span></div><h2 class="pre">Before you press play…</h2><button id="celebrate" class="btn celebrate">🎈 Celebrate</button><div class="msg"><h1>Happy 22nd Birthday, Tia ❤️</h1><p>Today, you’re the main character.</p></div><button id="enter" class="btn enter">▶ Enter TiaFlix</button></div>
</section>
<button id="replay" class="replay" aria-label="Replay birthday surprise">🎈</button>
<script>
(()=>{const intro=document.getElementById('intro'),site=document.getElementById('site'),celebrate=document.getElementById('celebrate'),enter=document.getElementById('enter'),replay=document.getElementById('replay');const colors=['#e50914','#ff8fa3','#ffd7de','#f6c453','#fff','#a56cff'];function addFx(){const b=document.getElementById('balloons'),c=document.getElementById('confetti');b.innerHTML='';c.innerHTML='';for(let i=0;i<16;i++){let e=document.createElement('i');e.className='balloon';e.style.setProperty('--x',Math.random()*95+'%');e.style.setProperty('--s',45+Math.random()*40+'px');e.style.setProperty('--c',colors[Math.floor(Math.random()*colors.length)]);e.style.setProperty('--d',7+Math.random()*3+'s');e.style.setProperty('--delay',Math.random()*1.8+'s');b.appendChild(e)}for(let i=0;i<90;i++){let e=document.createElement('i');e.className='piece';e.style.setProperty('--x',Math.random()*100+'%');e.style.setProperty('--c',colors[Math.floor(Math.random()*colors.length)]);e.style.setProperty('--r',Math.random()*180+'deg');e.style.setProperty('--dx',-90+Math.random()*180+'px');e.style.setProperty('--d',3+Math.random()*2+'s');e.style.setProperty('--delay',Math.random()*.7+'s');c.appendChild(e)}}function music(){try{const A=window.AudioContext||window.webkitAudioContext,x=new A(),g=x.createGain();g.gain.value=.035;g.connect(x.destination);const n=[392,392,440,392,523.25,493.88,392,392,440,392,587.33,523.25];let t=x.currentTime+.05;n.forEach((f,i)=>{const o=x.createOscillator(),v=x.createGain();o.frequency.value=f;o.type='sine';v.gain.setValueAtTime(.4,t);v.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(v);v.connect(g);o.start(t);o.stop(t+.4);t+=i===1||i===7?.2:.42})}catch(e){}}function brand(){try{const d=site.contentDocument;if(!d||!d.body)return;d.title='TiaFlix — For Tia';const nav=d.querySelector('.brand');if(nav)nav.innerHTML='TIA<span>FLIX</span>';const mark=d.querySelector('.intro-mark');if(mark)mark.innerHTML='T<span>♥</span>';[...d.body.querySelectorAll('*')].forEach(el=>{[...el.childNodes].filter(n=>n.nodeType===3).forEach(n=>{const old=n.nodeValue,newv=old.replace(/LOVEFLIX/g,'TIAFLIX').replace(/LoveFlix/g,'TiaFlix');if(newv!==old)n.nodeValue=newv})})}catch(e){}}function openSite(){sessionStorage.setItem('tiaflixSeen','1');intro.classList.add('hide');site.classList.add('show');replay.classList.add('show');brand();setTimeout(()=>{try{const d=site.contentDocument,b=d&&d.querySelector('.intro .play-button');if(b)b.click()}catch(e){}},250)}celebrate.onclick=()=>{intro.classList.add('celebrating');addFx();music();setTimeout(()=>enter.classList.add('show'),3800)};enter.onclick=openSite;replay.onclick=()=>{intro.className='intro';enter.classList.remove('show');replay.classList.remove('show')};site.onload=brand;if(sessionStorage.getItem('tiaflixSeen')==='1')openSite()})();
</script>
</body></html>
